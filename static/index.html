<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local Voice Agent</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6f6b64; --line: #e4e1db;
    --accent: #2f6df6; --listen: #16a36a; --think: #d48a06; --speak: #2f6df6; --err: #c8372d;
    --user-bg: #1d1c1a; --user-ink: #ffffff; --bot-bg: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --panel: #1b1b19; --ink: #ecebe7; --muted: #9a968e; --line: #2c2b28;
      --user-bg: #ecebe7; --user-ink: #121211; --bot-bg: #262522; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 32px; display: flex; flex-direction: column;
    gap: 16px; min-height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 13px; }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .orb { --c: var(--muted); width: 120px; height: 120px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 55%, white), var(--c));
    transition: background .3s, transform .08s linear; box-shadow: 0 10px 40px -12px var(--c); }
  .orb::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--c);
    opacity: 0; }
  .orb[data-state="listening"] { --c: var(--listen); }
  .orb[data-state="thinking"] { --c: var(--think); }
  .orb[data-state="thinking"]::after { opacity: .6; animation: pulse 1.1s ease-out infinite; }
  .orb[data-state="speaking"] { --c: var(--speak); }
  .orb[data-state="speaking"]::after { opacity: .5; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.95); opacity: .7; } to { transform: scale(1.25); opacity: 0; } }
  .status { font-weight: 600; text-transform: capitalize; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; max-width: 420px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); padding: 9px 18px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary.on { background: var(--err); border-color: var(--err); }
  button:disabled { opacity: .45; cursor: default; }
  .log { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bg); border-bottom-left-radius: 4px; }
  .msg .t { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .msg.user .t { color: color-mix(in srgb, var(--user-ink) 60%, transparent); }
  .msg.err { align-self: center; color: var(--err); background: transparent; font-size: 13px; }
  .msg.cut::after { content: " — interrupted"; color: var(--muted); font-size: 12px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font: inherit; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); min-width: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Local Voice Agent</h1>
    <span class="meta" id="meta">connecting…</span>
  </header>

  <section class="stage">
    <div class="orb" id="orb" data-state="off"></div>
    <div class="status" id="status">Off</div>
    <div class="hint" id="hint">Press Start and allow the microphone. Use headphones so the agent doesn't hear itself.</div>
    <div class="controls">
      <button class="primary" id="mic">Start</button>
      <button id="stop" disabled>Interrupt</button>
      <button id="reset">New chat</button>
    </div>
  </section>

  <div class="log" id="log"></div>

  <form id="form">
    <input id="text" placeholder="Or type a message…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const orb = $("orb"), statusEl = $("status"), logEl = $("log"), meta = $("meta");

let ws, ctx, micCtx, micStream, micNode, micOn = false;
let outRate = 24000, nextTime = 0, sources = new Set();
let botBubble = null, botTurn = -1;

// ---------- websocket ----------
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/voice`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => (meta.textContent = "connected");
  ws.onclose = () => { meta.textContent = "disconnected — retrying…"; setState("off"); setTimeout(connect, 1500); };
  ws.onmessage = (e) => (typeof e.data === "string" ? onEvent(JSON.parse(e.data)) : playChunk(e.data));
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function onEvent(m) {
  switch (m.type) {
    case "ready": meta.textContent = `${m.llm} · tts: ${m.tts}`; outRate = m.output_sample_rate; break;
    case "state": setState(m.state); break;
    case "transcript": addMsg("user", m.text, `stt ${m.stt_ms} ms`); break;
    case "llm_token":
      if (m.turn !== botTurn || !botBubble) { botTurn = m.turn; botBubble = addMsg("bot", ""); }
      botBubble.firstChild.textContent += m.text; scroll(); break;
    case "tts_start": outRate = m.sample_rate; break;
    case "reply_done":
      if (botBubble && m.timings) {
        const t = m.timings, parts = [];
        if (t.first_token_ms != null) parts.push(`first token ${t.first_token_ms} ms`);
        if (t.first_audio_ms != null) parts.push(`first audio ${t.first_audio_ms} ms`);
        setFoot(botBubble, parts.join(" · "));
      }
      botBubble = null; break;
    case "interrupt": stopPlayback(); if (botBubble) botBubble.classList.add("cut"); botBubble = null; break;
    case "reset_done": logEl.innerHTML = ""; botBubble = null; break;
    case "error": addMsg("err", m.msg); break;
  }
}

// ---------- UI ----------
function setState(s) {
  orb.dataset.state = s;
  statusEl.textContent = s === "off" ? "Off" : s;
  $("stop").disabled = !(s === "thinking" || s === "speaking");
}
function addMsg(kind, text, foot) {
  const d = document.createElement("div");
  d.className = `msg ${kind}`;
  d.appendChild(document.createTextNode(text));
  if (foot) setFoot(d, foot);
  logEl.appendChild(d); scroll();
  return d;
}
function setFoot(d, text) { const t = document.createElement("span"); t.className = "t"; t.textContent = text; d.appendChild(t); }
function scroll() { window.scrollTo({ top: document.body.scrollHeight }); }

// ---------- audio out ----------
function ensureCtx() {
  if (!ctx) ctx = new AudioContext();
  if (ctx.state === "suspended") ctx.resume();
}
function playChunk(buf) {
  ensureCtx();
  const pcm = new Int16Array(buf);
  if (!pcm.length) return;
  const audio = ctx.createBuffer(1, pcm.length, outRate);
  const ch = audio.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = ctx.createBufferSource();
  src.buffer = audio; src.connect(ctx.destination);
  nextTime = Math.max(nextTime, ctx.currentTime + 0.03);
  src.start(nextTime);
  nextTime += audio.duration;
  sources.add(src); src.onended = () => sources.delete(src);
}
function stopPlayback() {
  for (const s of sources) { try { s.stop(); } catch {} }
  sources.clear(); nextTime = 0;
}

// ---------- audio in ----------
async function startMic() {
  ensureCtx();
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  // Capture in a 16 kHz context so the browser does high-quality, anti-aliased resampling.
  // Naive 48k->16k decimation folds high frequencies into the speech band and hurts STT.
  let srcNode;
  try {
    micCtx = new AudioContext({ sampleRate: 16000 });
    srcNode = micCtx.createMediaStreamSource(micStream);
  } catch {
    // Some browsers (Firefox) refuse a mic source in a context at a different rate:
    // capture at the native rate and low-pass below 8 kHz before the worklet downsamples.
    micCtx && micCtx.close();
    micCtx = new AudioContext();
    srcNode = micCtx.createMediaStreamSource(micStream);
    const lp1 = micCtx.createBiquadFilter(), lp2 = micCtx.createBiquadFilter();
    lp1.type = lp2.type = "lowpass";
    lp1.frequency.value = lp2.frequency.value = 7000;
    srcNode.connect(lp1); lp1.connect(lp2);
    srcNode = lp2;
  }
  await micCtx.audioWorklet.addModule("/static/mic-worklet.js");
  micNode = new AudioWorkletNode(micCtx, "mic-processor");
  micNode.port.onmessage = ({ data }) => {
    if (ws && ws.readyState === 1) ws.send(data.frame);
    orb.style.transform = `scale(${1 + Math.min(data.rms * 4, 0.25)})`;
  };
  srcNode.connect(micNode); // worklet is not connected to the speakers, so no feedback
  if (micCtx.state === "suspended") await micCtx.resume();
  micOn = true;
  $("mic").textContent = "Stop mic"; $("mic").classList.add("on");
  $("hint").textContent = "Listening. Just talk — pause briefly when you're done.";
  if (orb.dataset.state === "off") setState("idle");
}
function stopMic() {
  micStream && micStream.getTracks().forEach((t) => t.stop());
  micNode && micNode.disconnect();
  micCtx && micCtx.close(); micCtx = null;
  micOn = false; orb.style.transform = "";
  $("mic").textContent = "Start"; $("mic").classList.remove("on");
  $("hint").textContent = "Mic off. You can still type below.";
}

$("mic").onclick = async () => {
  try { micOn ? stopMic() : await startMic(); }
  catch (e) { addMsg("err", `Microphone error: ${e.message}`); }
};
$("stop").onclick = () => { send({ type: "interrupt" }); stopPlayback(); };
$("reset").onclick = () => { stopPlayback(); send({ type: "reset" }); };
$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  ensureCtx(); stopPlayback();
  addMsg("user", text, "typed");
  send({ type: "text", text });
  $("text").value = "";
};

connect();
</script>
</body>
</html>
